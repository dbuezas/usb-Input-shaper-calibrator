[platformio]
; `pio run` builds only the RP2040 firmware (the one bundled in the UI)
default_envs = pico

; generic RP2040 boards
[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
monitor_speed = 230400
upload_flags = -f
build_flags = -DRT_RP2040
test_ignore = test_firmware  ; host-only tests, see the native envs

; Raspberry Pi Pico: adds the status LED and the SMPS PWM mode (less noise)
[env:pico_rp2040]
extends = env:pico
build_flags = ${env:pico.build_flags} -DRT_PICO

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = arduino
build_flags =  -DPIO_FRAMEWORK_ARDUINO_ENABLE_CDC
               -DUSBCON
               -DRT_BLUEPILL
test_ignore = test_firmware

[env:bluepill_f103c8_boot8k]
extends = env:bluepill_f103c8
; 8kib bootloader
board_upload.offset_address = 0x08002000
board_build.flash_offset    = 0x2000
upload_protocol = dfu

; Host tests: the real firmware against a simulated ADXL345 / LIS2DW12, no hardware needed.
;   pio test -e native_fly -e native_btt -e native_fysetc -e native_bluepill
[native]
platform = native
test_build_src = no
build_flags = -std=gnu++17 -Itest/mocks -DUNITY_INCLUDE_DOUBLE

[env:native_fly]
extends = native
build_flags = ${native.build_flags} -DRT_RP2040 -DBOARD=BOARD_FLY_ADXL345

[env:native_btt]
extends = native
build_flags = ${native.build_flags} -DRT_RP2040 -DBOARD=BOARD_BTT_LIS2DW

[env:native_fysetc]
extends = native
build_flags = ${native.build_flags} -DRT_RP2040 -DBOARD=BOARD_FYSETC_PIS

; Bit-banged SPI (opt-in with -DSPI_BITBANG), tested at the pin level
[env:native_fly_bitbang]
extends = native
build_flags = ${native.build_flags} -DRT_RP2040 -DBOARD=BOARD_FLY_ADXL345 -DSPI_BITBANG

[env:native_bluepill]
extends = native
build_flags = ${native.build_flags} -DRT_BLUEPILL
