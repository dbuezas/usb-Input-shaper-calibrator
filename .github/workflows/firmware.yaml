name: Firmware

on:
  push:
    branches: [main]
    paths: ['src/**', 'test/**', 'platformio.ini', 'scripts/build-firmware.sh', '.github/actions/build-firmware/**', '.github/workflows/firmware.yaml']
  pull_request:
    paths: ['src/**', 'test/**', 'platformio.ini', 'scripts/build-firmware.sh', '.github/actions/build-firmware/**', '.github/workflows/firmware.yaml']
  workflow_dispatch:

jobs:
  test:
    name: Host tests (simulated accelerometers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio
      - run: pio test -e native_fly -e native_btt -e native_fysetc -e native_fly_bitbang -e native_bluepill

  build:
    name: Build all boards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-firmware
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: UI/src/assets/firmware/
