name: Build firmware
description: Builds the firmware for every supported board into UI/src/assets/firmware (scripts/build-firmware.sh).

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - uses: actions/cache@v4
      with:
        path: ~/.platformio
        key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

    - name: Install PlatformIO
      shell: bash
      run: pip install platformio

    - name: Build all boards
      shell: bash
      working-directory: ${{ github.workspace }}
      run: scripts/build-firmware.sh
